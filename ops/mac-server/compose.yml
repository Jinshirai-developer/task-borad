name: taskboard-mac
services:
  db:
    image: postgres:16
    container_name: taskboard-mac-db
    env_file: ../../.local/mac-server/database.env
    ports: ["127.0.0.1:5439:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [database]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  keys-init:
    image: node:22-alpine
    user: root
    command: ["sh", "-c", "chown 1654:1654 /keys && chmod 700 /keys"]
    volumes: ["keys:/keys"]
    network_mode: none
    restart: "no"
  app:
    image: task-board:mac-server-20260911
    container_name: taskboard-mac-app
    env_file: ../../.local/mac-server/runtime.env
    ports: ["127.0.0.1:5099:8080"]
    volumes: ["keys:/var/lib/task-board/keys"]
    networks: [default, database]
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      keys-init: {condition: service_completed_successfully}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  tunnel:
    image: cloudflare/cloudflared:2026.9.0
    container_name: taskboard-mac-tunnel
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:8080", "--http-host-header", "localhost", "--protocol", "http2"]
    profiles: [public]
    networks: [default]
    restart: unless-stopped
    depends_on: [app]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  verification-mail:
    image: axllent/mailpit:v1.31.1
    container_name: taskboard-mac-mail
    profiles: [verification]
    ports: ["127.0.0.1:8039:8025"]
    networks: [default]
    restart: "no"
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
volumes:
  database:
  keys:
networks:
  database: {internal: true}
